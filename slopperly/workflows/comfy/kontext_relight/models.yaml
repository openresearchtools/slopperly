workflow_id: kontext_relight
runtime: comfy
required_custom_nodes:
  - id: comfyui
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - LoadImage
      - UNETLoader
      - LoraLoaderModelOnly
      - DualCLIPLoader
      - VAELoader
      - CLIPTextEncode
      - FluxGuidance
      - FluxKontextImageScale
      - VAEEncode
      - ReferenceLatent
      - ConditioningZeroOut
      - EmptySD3LatentImage
      - KSampler
      - VAEDecode
      - SaveImage
model_files:
  - source: https://huggingface.co/Comfy-Org/flux1-kontext-dev_ComfyUI/resolve/main/split_files/diffusion_models/flux1-dev-kontext_fp8_scaled.safetensors
    target: models/diffusion_models/flux1-dev-kontext_fp8_scaled.safetensors
  - source: https://huggingface.co/kontext-community/relighting-kontext-dev-lora-v3/resolve/main/relighting-kontext-dev-lora-v3.safetensors
    target: models/loras/relighting-kontext-dev-lora-v3.safetensors
  - source: https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors
    target: models/text_encoders/clip_l.safetensors
  - source: https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/t5xxl_fp8_e4m3fn_scaled.safetensors
    target: models/text_encoders/t5xxl_fp8_e4m3fn_scaled.safetensors
  - source: https://huggingface.co/Kijai/flux-fp8/resolve/main/flux-vae-bf16.safetensors
    target: models/vae/ae.safetensors
supported_resolutions:
  - 1024x1024
  - 1280x720
  - 720x1280
artifact_contract:
  type: image/png
  validator: PIL readable image; dimensions match requested width and height.
