workflow_id: flux_redux_restyle
runtime: comfy
required_custom_nodes:
  - id: comfyui
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - LoadImage
      - UNETLoader
      - VAELoader
      - DualCLIPLoader
      - CLIPTextEncode
      - FluxGuidance
      - CLIPVisionLoader
      - CLIPVisionEncode
      - StyleModelLoader
      - StyleModelApply
      - BasicGuider
      - BasicScheduler
      - ModelSamplingFlux
      - EmptySD3LatentImage
      - KSamplerSelect
      - RandomNoise
      - SamplerCustomAdvanced
      - VAEDecode
      - SaveImage
model_files:
  - source: https://huggingface.co/Comfy-Org/flux1-dev/resolve/main/flux1-dev.safetensors
    target: models/diffusion_models/flux1-dev.safetensors
  - source: https://huggingface.co/Runware/FLUX.1-Redux-dev/resolve/main/flux1-redux-dev.safetensors
    target: models/style_models/flux1-redux-dev.safetensors
  - source: https://huggingface.co/Comfy-Org/sigclip_vision_384/resolve/main/sigclip_vision_patch14_384.safetensors
    target: models/clip_vision/sigclip_vision_patch14_384.safetensors
  - source: https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors
    target: models/text_encoders/clip_l.safetensors
  - source: https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/t5xxl_fp16.safetensors
    target: models/text_encoders/t5xxl_fp16.safetensors
  - source: https://huggingface.co/Kijai/flux-fp8/resolve/main/flux-vae-bf16.safetensors
    target: models/vae/ae.safetensors
supported_resolutions:
  - 1024x1024
  - 1280x720
  - 720x1280
artifact_contract:
  type: image/png
  validator: PIL readable image; dimensions match requested width and height.
