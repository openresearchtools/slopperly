workflow_id: krea2_turbo_t2i
runtime: comfy
required_custom_nodes:
  - id: comfyui
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - CLIPLoader
      - VAELoader
      - TextGenerate
      - CLIPTextEncode
      - ConditioningZeroOut
      - EmptyLatentImage
      - KSampler
      - VAEDecode
      - SaveImage
  - id: comfyui_gguf
    repo: https://github.com/city96/ComfyUI-GGUF.git
    commit: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
    node_classes:
      - UnetLoaderGGUF
model_files:
  - source: https://huggingface.co/vantagewithai/Krea-2-Turbo-GGUF/resolve/main/krea2_turbo-Q5_K_M.gguf
    target: models/diffusion_models/krea2_turbo-Q5_K_M.gguf
  - source: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/text_encoders/qwen3vl_4b_fp8_scaled.safetensors
    target: models/text_encoders/qwen3vl_4b_fp8_scaled.safetensors
  - source: https://huggingface.co/Comfy-Org/Krea-2/resolve/main/vae/qwen_image_vae.safetensors
    target: models/vae/qwen_image_vae.safetensors
supported_resolutions:
  - 1024x1024
  - 1280x720
  - 720x1280
artifact_contract:
  type: image/png
  validator: PIL readable image; dimensions match requested width and height.
