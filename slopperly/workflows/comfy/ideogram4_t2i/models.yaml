workflow_id: ideogram4_t2i
runtime: comfy
required_custom_nodes:
  - id: comfyui
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - CLIPLoader
      - CLIPTextEncode
      - ConditioningZeroOut
      - CFGOverride
      - DualModelGuider
      - EmptyFlux2LatentImage
      - RandomNoise
      - KSamplerSelect
      - Ideogram4Scheduler
      - SamplerCustomAdvanced
      - VAELoader
      - VAEDecode
      - SaveImage
  - id: comfyui_gguf
    repo: https://github.com/city96/ComfyUI-GGUF.git
    commit: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
    node_classes:
      - UnetLoaderGGUF
model_files:
  - source: https://huggingface.co/molbal/ideogram-4-gguf/resolve/main/ideogram4-transformer-q5_0.gguf
    target: models/diffusion_models/ideogram4-transformer-q5_0.gguf
  - source: https://huggingface.co/molbal/ideogram-4-gguf/resolve/main/ideogram4-unconditional_transformer-q5_0.gguf
    target: models/diffusion_models/ideogram4-unconditional_transformer-q5_0.gguf
  - source: https://huggingface.co/Comfy-Org/Ideogram-4/resolve/main/text_encoders/qwen3vl_8b_fp8_scaled.safetensors
    target: models/text_encoders/qwen3vl_8b_fp8_scaled.safetensors
  - source: https://huggingface.co/Comfy-Org/Ideogram-4/resolve/main/vae/flux2-vae.safetensors
    target: models/vae/flux2-vae.safetensors
supported_resolutions:
  - 1024x1024
  - 1280x720
  - 720x1280
artifact_contract:
  type: image/png
  validator: PIL readable image; dimensions match requested width and height.
