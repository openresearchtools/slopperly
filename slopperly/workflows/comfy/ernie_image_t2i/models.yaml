workflow_id: ernie_image_t2i
runtime: comfy
required_custom_nodes:
  - id: comfyui
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - UNETLoader
      - CLIPLoader
      - VAELoader
      - TextGenerate
      - CLIPTextEncode
      - EmptyFlux2LatentImage
      - KSampler
      - VAEDecode
      - SaveImage
model_files:
  - source: https://huggingface.co/Comfy-Org/ERNIE-Image/resolve/main/diffusion_models/ernie-image.safetensors
    target: models/diffusion_models/ernie-image.safetensors
  - source: https://huggingface.co/Comfy-Org/ERNIE-Image/resolve/main/text_encoders/ministral-3-3b.safetensors
    target: models/text_encoders/ministral-3-3b.safetensors
  - source: https://huggingface.co/Comfy-Org/ERNIE-Image/resolve/main/text_encoders/ernie-image-prompt-enhancer.safetensors
    target: models/text_encoders/ernie-image-prompt-enhancer.safetensors
  - source: https://huggingface.co/Comfy-Org/ERNIE-Image/resolve/main/vae/flux2-vae.safetensors
    target: models/vae/flux2-vae.safetensors
supported_resolutions:
  - 1024x1024
  - 1280x720
  - 720x1280
artifact_contract:
  type: image/png
  validator: PIL readable image; dimensions match requested width and height.
