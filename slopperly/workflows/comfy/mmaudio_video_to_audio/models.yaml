workflow_id: mmaudio_video_to_audio
task: video_to_audio
runtime: comfy
required_custom_nodes:
  - id: video_helper_suite
    repo: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git
    commit: 4ee72c065db22c9d96c2427954dc69e7b908444b
    classes:
      - VHS_LoadVideo
  - id: comfyui_mmaudio
    repo: https://github.com/kijai/ComfyUI-MMAudio.git
    commit: 8eaeb72edc3aaf2059b57f2d96a1f6f689f19ae2
    classes:
      - MMAudioModelLoader
      - MMAudioFeatureUtilsLoader
      - MMAudioSampler
      - MMAudioVoCoderLoader
  - id: comfyui_core_audio
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    classes:
      - SaveAudio
model_files:
  primary_source:
    repo: Kijai/MMAudio_safetensors
    target_dir: models/mmaudio
    files:
      - mmaudio_large_44k_v2_fp16.safetensors
      - mmaudio_vae_44k_fp16.safetensors
      - mmaudio_synchformer_fp16.safetensors
      - apple_DFN5B-CLIP-ViT-H-14-384_fp16.safetensors
  auxiliary_sources:
    - repo: nvidia/bigvgan_v2_44khz_128band_512x
      target_dir: models/mmaudio/nvidia/bigvgan_v2_44khz_128band_512x
      required_files:
        - config.json
        - bigvgan_generator.pt
      ignore_patterns:
        - "*3msteps*"
supported_profiles:
  - input: video
    output: flac
    mode: 44k
    sample_rate: 44100
    default_duration: 8.0
    default_steps: 25
    default_cfg: 4.5
artifact_contract:
  output_type: audio
  validation:
    - one FLAC or WAV-readable audio artifact is returned
    - sample rate is 44100 for the committed 44k profile
    - duration matches requested audio_length unless the source video is shorter
    - waveform is non-silent for real GPU certification
