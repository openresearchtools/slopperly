workflow_id: zimage_t2i_i2i
runtime: comfy
required_custom_nodes:
  - id: comfyui_gguf
    repo: https://github.com/city96/ComfyUI-GGUF.git
    commit: fcf3c4c98baf3a6f78f5200b73d86436931c43fb
    node_classes:
      - UnetLoaderGGUF
  - id: comfyui_core
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - ModelSamplingAuraFlow
      - CLIPLoader
      - VAELoader
      - CLIPTextEncode
      - EmptySD3LatentImage
      - KSampler
      - VAEDecode
      - SaveImage
model_files:
  - source: https://huggingface.co/unsloth/Z-Image-GGUF
    download_mode: hf_file
    files:
      - path: z-image-Q5_K_M.gguf
        target: models/diffusion_models/z-image-Q5_K_M.gguf
  - source: https://huggingface.co/Comfy-Org/z_image_turbo
    download_mode: hf_file
    files:
      - path: split_files/text_encoders/qwen_3_4b.safetensors
        target: models/text_encoders/qwen_3_4b.safetensors
      - path: split_files/vae/ae.safetensors
        target: models/vae/ae.safetensors
artifact_contract:
  type: image/png
  min_width: 512
  min_height: 512
  output_shape: single artifact path
