workflow_id: flux1_depth_control
runtime: comfy
required_custom_nodes:
  - id: comfyui
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - LoadImage
      - ImageScale
      - LoraLoaderModelOnly
      - VAELoader
      - DualCLIPLoader
      - CLIPTextEncode
      - FluxGuidance
      - InstructPixToPixConditioning
      - KSampler
      - VAEDecode
      - SaveImage
  - id: controlnet_aux
    repo: https://github.com/Fannovel16/comfyui_controlnet_aux.git
    commit: e8b689a513c3e6b63edc44066560ca5919c0576e
    node_classes:
      - DepthAnythingV2Preprocessor
  - id: comfyui_gguf
    repo: https://github.com/city96/ComfyUI-GGUF.git
    node_classes:
      - UnetLoaderGGUF
model_files:
  - source: https://huggingface.co/SporkySporkness/FLUX.1-Depth-dev-GGUF/resolve/main/flux1-depth-dev-fp16-Q5_0-GGUF.gguf
    target: models/diffusion_models/flux1-depth-dev-fp16-Q5_0-GGUF.gguf
  - source: https://huggingface.co/Comfy-Org/flux1-dev/resolve/main/split_files/loras/flux1-depth-dev-lora.safetensors
    target: models/loras/flux1-depth-dev-lora.safetensors
  - source: https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors
    target: models/text_encoders/clip_l.safetensors
  - source: https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/t5xxl_fp16.safetensors
    target: models/text_encoders/t5xxl_fp16.safetensors
  - source: https://huggingface.co/Kijai/flux-fp8/resolve/main/flux-vae-bf16.safetensors
    target: models/vae/ae.safetensors
  - source: https://huggingface.co/depth-anything/Depth-Anything-V2-Large/resolve/main/depth_anything_v2_vitl.pth
    target: custom_nodes/controlnet_aux/ckpts/depth-anything/Depth-Anything-V2-Large/depth_anything_v2_vitl.pth
supported_resolutions:
  - 1024x1024
  - 1280x720
  - 720x1280
artifact_contract:
  type: image/png
  validator: PIL readable image; dimensions match requested width and height.
