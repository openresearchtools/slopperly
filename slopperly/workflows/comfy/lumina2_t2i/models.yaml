workflow_id: lumina2_t2i
runtime: comfy
required_custom_nodes:
  - id: comfyui_gguf
    repo: https://github.com/city96/ComfyUI-GGUF.git
    commit: pinned in slopperly/runtime/comfy/nodes.lock.yaml
    node_classes:
      - UnetLoaderGGUF
  - id: comfyui
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - ModelSamplingAuraFlow
      - CLIPLoader
      - CLIPTextEncodeLumina2
      - CLIPTextEncode
      - EmptySD3LatentImage
      - KSampler
      - VAELoader
      - VAEDecode
      - SaveImage
model_files:
  - source: local postprocess from Comfy-Org/Lumina_Image_2.0_Repackaged split_files/diffusion_models/lumina_2_model_bf16.safetensors
    target: models/diffusion_models/lumina_2_model-Q5_K_M.gguf
  - source: https://huggingface.co/Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/main/split_files/diffusion_models/lumina_2_model_bf16.safetensors
    target: models/diffusion_models/lumina_2_model_bf16.safetensors
  - source: https://huggingface.co/Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/main/split_files/text_encoders/gemma_2_2b_fp16.safetensors
    target: models/text_encoders/gemma_2_2b_fp16.safetensors
  - source: https://huggingface.co/Comfy-Org/Lumina_Image_2.0_Repackaged/resolve/main/split_files/vae/ae.safetensors
    target: models/vae/lumina2_ae.safetensors
supported_resolutions:
  - 1024x1024
  - 1280x720
  - 720x1280
artifact_contract:
  type: image/png
  validator: PIL readable image; dimensions match requested width and height.
