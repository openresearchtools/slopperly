workflow_id: chatterbox_multilingual_tts_comfy
runtime: comfy
required_custom_nodes:
  - id: chatterbox
    repo: https://github.com/filliptm/ComfyUI_Fill-ChatterBox.git
    commit: 596850bc61665e9318914841b41ee4154253f020
    node_classes:
      - FL_ChatterboxMultilingualTTS
  - id: comfyui_core
    repo: https://github.com/comfyanonymous/ComfyUI.git
    commit: 603d891eaf045d726d9c23276b4428daf2977624
    node_classes:
      - SaveAudio
model_files:
  - source: https://huggingface.co/ResembleAI/chatterbox
    download_mode: hf_snapshot
    files:
      - path: ve.pt
        target: models/chatterbox/chatterbox_multilingual/ve.pt
      - path: t3_mtl23ls_v2.safetensors
        target: models/chatterbox/chatterbox_multilingual/t3_mtl23ls_v2.safetensors
      - path: s3gen.pt
        target: models/chatterbox/chatterbox_multilingual/s3gen.pt
      - path: grapheme_mtl_merged_expanded_v1.json
        target: models/chatterbox/chatterbox_multilingual/grapheme_mtl_merged_expanded_v1.json
      - path: conds.pt
        target: models/chatterbox/chatterbox_multilingual/conds.pt
      - path: Cangjie5_TC.json
        target: models/chatterbox/chatterbox_multilingual/Cangjie5_TC.json
artifact_contract:
  type: audio/flac
  sample_rate: 24000
  non_silent: true
  output_shape: single artifact path
