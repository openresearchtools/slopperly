models:
  - logical_name: qwen_image_edit_2511_multi_gguf
    legacy_aliases:
      - google/nano-banana
    task: image_edit
    runtime: comfy
    model_source: https://huggingface.co/unsloth/Qwen-Image-Edit-2511-GGUF
    local_cache_path: models/diffusion_models/qwen-image-edit-2511-Q5_K_M.gguf
    required_files:
      - qwen-image-edit-2511-Q5_K_M.gguf
    required_node_pack: comfyui_gguf
    supported_resolutions:
      - 1024x1024
    default_parameters:
      steps: 25
      fps: null
    minimum_vram_gb: 16
    validation_command: pytest tests/gpu/test_qwen_image_edit_2511.py --device cuda
    workflows:
      - qwen_image_edit_2511_multi_gguf
  - logical_name: wan22_ti2v_5b_720p24_gguf
    legacy_aliases:
      - google/veo
      - Hailuo/MiniMax/txt2vid
      - Hailuo/MiniMax/img2vid
    task: video_t2v_i2v
    runtime: comfy
    model_source: https://huggingface.co/QuantStack/Wan2.2-TI2V-5B-GGUF
    local_cache_path: models/diffusion_models/Wan2.2-TI2V-5B-Q5_K_M.gguf
    required_files:
      - Wan2.2-TI2V-5B-Q5_K_M.gguf
    required_node_pack: comfyui_gguf
    supported_resolutions:
      - 1280x704
      - 704x1280
    supported_fps:
